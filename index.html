<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Meditazione Timer A.C.D.</title>
<meta name="description" content="Timer di meditazione multi-fase con suoni rilassanti, pagine personalizzabili e design pensato per il relax." />
<meta name="theme-color" content="#241b4e" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

  <nav id="pageTabs" class="page-tabs" aria-label="Pagine di meditazione"></nav>

  <main id="mainView" class="main-view"></main>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
